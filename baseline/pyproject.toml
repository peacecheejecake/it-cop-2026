[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deployment-risk-baselines"
version = "0.1.0"
description = "Public-only training and label-blind internal evaluation for change risk"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2", "httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
neural = ["torch>=2.6,<3", "transformers==4.57.6", "safetensors>=0.4,<1"]
dev = ["pytest>=8,<10"]

[project.scripts]
riskbench = "riskbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
