# Extension study L2-S (spec comparison-matrix §6, T39, priority P3), registered 2026-10-01 AFTER the v3 public test
# was opened (freeze b6afa59f3a2a9550). Everything except the retrieval step is identical to public-comparison-v3
# (same Qwen pin, template, scorer, k=4 with 2/2 class mix, seeds 42/43/44). The retriever is the spec's proposed
# default, parameters copied from B1's char analyzer; nothing was chosen with v3 test results. Its own freeze and
# one test evaluation follow; L2 vs L1/L0 on test is a post-hoc extension comparison, not part of the untouched v3 matrix.
# Study registration (spec implementation-plan §6, protocol §2.1). All 9 primary variants are
# registered before any test access; sections still PIN_REQUIRED block only the variants that read them.
#
# v3 (2026-10-01, registered before any public-test access; supersedes v2):
# - finetune: encoder and head learning rates are separate (encoder 1e-5, head 1e-3) for B2-S..B5-S
#   alike; max_epochs 100, patience 5. In v2 the shared lr 1e-5 left the randomly initialised head
#   under-trained (B2-S still improving at the 20-epoch cap). Disclosure: head lr 1e-3 was informed by
#   the supplementary B2 sensitivity on public validation (exp 008); configurations seen on validation:
#   v2 (lr 1e-5 shared) and this one. No other candidates were tried for any variant.
# - split upstream-clean2: same train/valid/test membership as upstream-clean1, CPT-dev drawn by
#   exact/code duplicate group so CPT-dev text never also appears in CPT-train.
# - All primary variants are re-run under v3; v2 results remain as the record of the initial protocol.
schema_version: 2
matrix_version: 2
study_id: public-comparison-v3-l2ext
track: controlled
protocol_version: v3-l2ext

dataset:
  snapshot_id: jitd4j-audit1
  split_id: upstream-clean2
  source_approval: configs/sources/jit-defects4j.yaml
  train_visibility: public
  feature_profile: jit14-audited-v1

model:
  base: microsoft/codebert-base
  revision: 3b0952feddeffad0063f274080e3c23d75e7eb39
  local_path: cache:models/codebert-base
  weights_file: pytorch_model.bin
  weights_sha256: 28b61fd8fa069f6bc966f4cb9572a4026ab2a784fca8fb224020d91b744e32d6
  renderer: message-add-del-text-v2
  max_length: 512
  max_message_tokens: 64
  fusion_head: cls-feature-tanh-v1

experiments: [L2-S]
evidence_profile: matched
information_profile: structured_fused

structured:
  features: [ns, nd, nf, entropy, la, ld, lt, fix, ndev, age, nuc, exp, rexp, sexp]
  lr_transform: signed_log1p_median_impute_standardize
  lr: {C: 1.0, max_iter: 1000}
  lgbm: {num_leaves: 15, learning_rate: 0.05, n_estimators: 300, min_child_samples: 20, num_threads: 4}

text_baseline:
  classifier: logistic_regression
  analyzer: char
  ngram_range: [3, 5]
  lowercase: false
  min_df: 2
  max_features_per_field: 50000
  fit_role: supervised_train
  lr: {C: 1.0, max_iter: 1000}

seeds: [42, 43, 44]

evaluation:
  primary_metrics: [ap, recall_at_5pct, recall_at_10pct]
  budget_unit: change_count
  topk_rounding: ceil
  tie_salt: topk-tie-v1
  threshold_policy: validation_max_f1_then_highest_threshold
  calibration: none
  require_freeze_for_test: true

policy:
  allow_internal_training: false
  allow_internal_demonstrations: false
  allow_internal_index_members: false
  allow_remote_llm: false
  allow_test_selection: false
  automatic_remote_logging: false

# Shared downstream protocol for B2-S/B3-S/B4-S/B5-S (spec protocol §2.1); B2-S only freezes the encoder.
# precision: fp32 until the CUDA 100-step profile (spec T14) shows bf16_encoder_autocast is equivalent; then re-pinned before formal runs.
finetune:
  max_epochs: 100
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  encoder_learning_rate: 0.00001
  head_learning_rate: 0.001
  weight_decay: 0.01
  lr_schedule: constant
  max_grad_norm: 1.0
  head_dropout: 0.1
  selection_metric: validation_ap
  patience_epochs: 5
  tie_rule: earlier_checkpoint
  precision: fp32
  device: cuda
  allow_cpu: false
  eval_batch_size: 64
cpt:
  permitted_role: cpt_train
  corpus: evidence_query_text
  budget_unit: nonpadding_input_token_exposures
  budget: 10000000
  micro_batch_size: 8
  gradient_accumulation_steps: 16
  learning_rate: 0.00002
  weight_decay: 0.01
  lr_schedule: linear_warmup_linear_decay
  warmup_fraction: 0.06
  max_grad_norm: 1.0
  mlm_probability: 0.15
  mask_replace_fraction: 0.8
  random_replace_fraction: 0.1
  protect_renderer_structure: true
  zero_selection_rule: force_one_uniform
  b5_task_schedule: alternating_1_to_1
  rmi_replacement_probability: 0.5
  dev_eval_every_updates: 25
  dev_mask_seed: 20261001
  checkpoint_every_updates: 50
  precision: fp32
  device: cuda
  allow_cpu: false
  eval_batch_size: 64
llm:
  # Pinned 2026-10-01 before any L0/L1 run or test access (user choice: Qwen2.5-Coder-7B-Instruct).
  backend: local_hf
  model_id: Qwen/Qwen2.5-Coder-7B-Instruct
  revision: c03e6d358207e414f1eca0bb1891e29f1db0e242
  tokenizer_revision: c03e6d358207e414f1eca0bb1891e29f1db0e242
  license: apache-2.0
