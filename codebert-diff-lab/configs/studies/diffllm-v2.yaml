    model: qwen7b
    cpt: false
    head: risk_sft
    representation: ev
  R-ev-jit14:
    model: qwen7b
    cpt: false
    head: risk_sft
    representation: ev-jit14
  R-14B:
    model: qwen14b
    cpt: false
    head: risk_sft
    representation: stage1-best
# R-14B uses the representation of the stage-1 arm with the higher full-validation AP; ties go to the first listed.
