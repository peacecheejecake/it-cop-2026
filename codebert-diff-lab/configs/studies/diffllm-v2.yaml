- R-ev-jit14
- R-ev
sft:
  max_prompt_tokens: 1536
  micro_batch: 1
  accumulation: 16
  learning_rate: 0.0001
  max_epochs: 2
  evals_per_epoch: 2
  patience_evals: 2
  selection_subset: 2000
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  gradient_checkpointing: true
  eval_token_budget: 32768
  eval_schedule: even
