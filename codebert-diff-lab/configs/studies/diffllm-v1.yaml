# Study diffllm-v1 (exploratory). Values follow docs/diffllm-study-v1.md, registered before any training.
# Deviation recorded before training: checkpoint selection during SFT uses a fixed 2,000-change subset of public
# validation (sha256 rank, label-free) to bound evaluation cost; reported validation metrics use all 5,465 changes.
study_id: diffllm-v1
status: exploratory (beyond spec v0.2; registered after the v3 public test was opened)
design_doc: docs/diffllm-study-v1.md
dataset:
  snapshot_id: jitd4j-audit1
  split_id: upstream-clean2
  source_approval: configs/sources/jit-defects4j.yaml
representation:
  id: full-diff-v1
  git_cmd: git show <sha> --format= -U3 --no-color --no-ext-diff --first-parent
  max_message_tokens: 128
  max_content_tokens: 2048
  truncation: drop whole hunks from the end
  text_only: true
cpt_corpus:
  id: apache-disjoint-diffs-v1
  repos:
  - zookeeper
  - zeppelin
  - activemq
  - kafka
  - cassandra
  - groovy
  salt: cpt-diff-v1
  budget_tokens: 50000000
  max_tokens_per_commit: 2048
  exclude: duplicate diffs and diffs identical to any JD4J labeled diff
