[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "codebert-diff-lab"
version = "0.2.0"
description = "Controlled comparison of structured, TF-IDF, CodeBERT (frozen/FT/CPT) and frozen-LLM change-risk models (spec v0.2)"
requires-python = "==3.11.*"
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<22",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "transformers==4.57.6",
  "tokenizers>=0.20,<1",
]

[project.optional-dependencies]
lgbm = ["lightgbm>=4.5,<5"]
neural = ["torch>=2.6,<3", "safetensors>=0.4,<1"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
diff-lab = "diff_lab.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/diff_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/diff_lab/cli/main.py" = ["B008"]  # typer.Option defaults are the Typer idiom

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
